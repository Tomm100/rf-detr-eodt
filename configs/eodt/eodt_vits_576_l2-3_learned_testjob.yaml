# EoDT ViT-S, 576 px, L2 = 3, learned queries: test job of the first run on Leonardo (EODT_SPEC.md §9, step 6).
# Copy of eodt_vits_576_l2-3_learned.yaml with only the keys marked "test job:" changed (checked by
# tests/eodt/test_leonardo_files.py): 2 epochs, its own output_dir and W&B run. Launched twice by
# scripts/leonardo/train.sh with --limit-train-batches 300 --limit-val-batches 40, the first time with
# --stop-after-epoch 1, the second with --resume, to test resume, W&B and bf16 within the 30 minutes of the debug QOS.
#
# Written as the configurations hold them: "off" between quotes (bare off is the boolean false) and floats
# with a dot (pyyaml reads 1e-4 as a string). TrainConfig would convert both, but the tests compare file and
# configuration value by value.

model:
  model_config:
    class_path: rfdetr.models.eodt.EoDTConfig
    init_args:
      backbone_name: vit_small_patch14_reg4_dinov2  # §3.1: DINOv2 with 4 registers
      resolution: 576  # §3.1 [DA CONFERMARE]
      patch_size: 16
      num_l2_blocks: 3  # §3.2, no default in the code
      num_queries: 300  # §3.3
      query_mode: learned
      group_detr: 1  # §4, alternative (a)
      num_classes: 90  # COCO: 91 logits
  train_config:
    class_path: rfdetr.config.TrainConfig
    init_args:
      dataset_file: coco
      dataset_dir: /leonardo_scratch/fast/IscrC_EoDT/coco
      output_dir: /leonardo_work/IscrC_EoDT/tcentonz/runs/eodt_vits_576_l2-3_learned_testjob  # test job
      # input and augmentation (§7.0)
      multi_scale: "off"
      square_resize_div_64: true
      augmentation_backend: torchvision
      # optimization (§7.1)
      lr: 1.0e-4
      lr_encoder: 1.5e-4
      lr_vit_layer_decay: 0.8
      lr_component_decay: 0.7
      weight_decay: 1.0e-4
      clip_max_norm: 0.1
      lr_scheduler: cosine
      warmup_epochs: 1
      epochs: 2  # test job: one epoch per job, each limited to 300 training batches
      batch_size: 4  # per GPU
      grad_accum_steps: 1
      cls_loss_coef: 1.0
      use_ema: true
      ema_decay: 0.993
      amp_dtype: bf16
      seed: 0
      # evaluation (§6): COCO maxDets, applied per image and class; PostProcess keeps num_select = 300
      # detections per image. The same for EoDT and baseline
      eval_max_dets: 100
      # logging (§7.3): W&B offline on the compute nodes, synced from the login node. scripts/leonardo/train.sh
      # sets WANDB_RUN_ID to the name of this file, so that the jobs of a resumed run continue the same W&B run
      wandb: true
      project: eodt
      run: eodt_vits_576_l2-3_learned_testjob  # test job: name of this file
      tensorboard: false  # W&B and metrics.csv already hold the curves
      # hardware (Leonardo)
      devices: 4
      num_nodes: 1
      strategy: ddp
      num_workers: 7  # per GPU: one core per GPU left to the main process
