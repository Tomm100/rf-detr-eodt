# EoDT ViT-S, 576 px, L2 = 3, learned queries: overfit on the 20 images of coco_mini on Leonardo, in bf16 on one A100
# (EODT_SPEC.md §9, first job of step 6). Copy of eodt_vits_576_l2-3_learned_overfit.yaml, the 2400-step overfit
# that passed on the PC in fp32, with only the keys marked "leonardo:" changed (checked by
# tests/eodt/test_leonardo_files.py). Launched by scripts/leonardo/overfit.sh with scripts/eodt/overfit.py, which
# checks the criteria of step 5.
#
# Written as the configurations hold them: "off" between quotes (bare off is the boolean false) and floats
# with a dot (pyyaml reads 1e-4 as a string). TrainConfig would convert both, but the tests compare file and
# configuration value by value.

model:
  model_config:
    class_path: rfdetr.models.eodt.EoDTConfig
    init_args:
      backbone_name: vit_small_patch14_reg4_dinov2  # §3.1: DINOv2 with 4 registers
      resolution: 576  # §3.1; fits in 4 GB with batch 4 in fp32
      patch_size: 16
      num_l2_blocks: 3  # §3.2, no default in the code
      num_queries: 300  # §3.3
      query_mode: learned
      group_detr: 1  # §4, alternative (a)
      num_classes: 90  # COCO: 91 logits
  train_config:
    class_path: rfdetr.config.TrainConfig
    init_args:
      dataset_file: coco
      dataset_dir: /leonardo_work/IscrC_EoDT/tcentonz/data/coco_mini  # leonardo: copy of the coco_mini of the PC
      output_dir: /leonardo_work/IscrC_EoDT/tcentonz/runs/eodt_vits_576_l2-3_learned_overfit_leonardo  # leonardo
      # input and augmentation (§7.0)
      multi_scale: "off"
      square_resize_div_64: true
      augmentation_backend: torchvision
      aug_config: {}  # overfit: no horizontal flip
      scale_jitter: false  # overfit: fixed resize, no random crop; train and val get the same pipeline
      # optimization (§7.1)
      lr: 1.0e-4
      lr_encoder: 1.5e-4
      lr_vit_layer_decay: 0.8
      lr_component_decay: 0.7
      weight_decay: 1.0e-4
      clip_max_norm: 0.1
      lr_scheduler: cosine
      warmup_epochs: 40  # overfit: 200 steps, 1/12 of the run as on COCO
      epochs: 480  # overfit: 2400 steps of 5 per epoch
      batch_size: 4  # 20 images = 5 batches: every image once per epoch, sampled without replacement
      grad_accum_steps: 1
      cls_loss_coef: 1.0
      use_ema: true
      ema_decay: 0.993
      amp_dtype: bf16  # leonardo: the precision of the runs, native on the A100
      seed: 0
      # evaluation (§6): COCO maxDets, applied per image and class; PostProcess keeps num_select = 300
      # detections per image. The same for EoDT and baseline
      eval_max_dets: 100
      eval_base_model: true  # overfit: evaluate the trained model as well as the EMA
      eval_interval: 4  # overfit: 120 evaluations over the 480 epochs, the last one included
      checkpoint_interval: 480  # overfit: one archive checkpoint instead of 48
      # logging (§7.3)
      wandb: true  # leonardo: W&B offline, tag "test"
      project: eodt
      run: eodt_vits_576_l2-3_learned_overfit_leonardo  # leonardo: name of this file
      tensorboard: false
      # hardware
      devices: 1  # overfit: one GPU
      num_nodes: 1
      strategy: auto  # overfit: no DDP
      num_workers: 0  # overfit: 20 small JPEG, read in the main process
