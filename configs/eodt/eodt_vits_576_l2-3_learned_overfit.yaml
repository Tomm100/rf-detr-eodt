# EoDT ViT-S, 576 px, L2 = 3, learned queries: overfit on the 20 images of coco_mini (EODT_SPEC.md §9, step 5).
# Copy of eodt_vits_576_l2-3_learned.yaml that runs on the local GTX 1650 (4 GB, no bf16). The model and the
# recipe of §7.1 are unchanged; only the keys marked "overfit:" differ (checked by tests/eodt/test_overfit_yaml.py).
# Launched by scripts/eodt/overfit.py, not part of the test suite.
#
# Written as the configurations hold them: "off" between quotes (bare off is the boolean false) and floats
# with a dot (pyyaml reads 1e-4 as a string). TrainConfig would convert both, but the tests compare file and
# configuration value by value.

model:
  model_config:
    class_path: rfdetr.models.eodt.EoDTConfig
    init_args:
      backbone_name: vit_small_patch14_reg4_dinov2  # §3.1: DINOv2 with 4 registers
      resolution: 576  # §3.1 [DA CONFERMARE]; fits in 4 GB with batch 4 in fp32
      patch_size: 16
      num_l2_blocks: 3  # §3.2, no default in the code
      num_queries: 300  # §3.3
      query_mode: learned
      group_detr: 1  # §4, alternative (a)
      num_classes: 90  # COCO: 91 logits
  train_config:
    class_path: rfdetr.config.TrainConfig
    init_args:
      dataset_file: coco
      dataset_dir: C:/dev/tesi/data/coco_mini  # overfit: 20 val2017 images, the same in train and val
      output_dir: C:/dev/tesi/rf-detr-eodt/output/eodt_vits_576_l2-3_learned_overfit  # overfit: git-ignored
      # input and augmentation (§7.0)
      multi_scale: "off"
      square_resize_div_64: true
      augmentation_backend: torchvision
      aug_config: {}  # overfit: no horizontal flip
      scale_jitter: false  # overfit: fixed resize, no random crop; train and val get the same pipeline
      # optimization (§7.1)
      lr: 1.0e-4
      lr_encoder: 1.5e-4
      lr_vit_layer_decay: 0.8
      lr_component_decay: 0.7
      weight_decay: 1.0e-4
      clip_max_norm: 0.1
      lr_scheduler: cosine
      warmup_epochs: 10  # overfit: 50 steps, 1/12 of the run as on COCO
      epochs: 120  # overfit: 600 steps of 5 per epoch
      batch_size: 4  # 20 images = 5 batches: every image once per epoch, sampled without replacement
      grad_accum_steps: 1
      cls_loss_coef: 1.0
      use_ema: true
      ema_decay: 0.993
      amp_dtype: null  # overfit: fp32, the GTX 1650 has no bf16
      seed: 0
      # evaluation (§6): COCO maxDets, applied per image and class; PostProcess keeps num_select = 300
      # detections per image. The same for EoDT and baseline
      eval_max_dets: 100
      eval_base_model: true  # overfit: evaluate the trained model as well as the EMA
      checkpoint_interval: 120  # overfit: one archive checkpoint instead of twelve
      # hardware (local PC)
      devices: 1  # overfit: one GPU
      num_nodes: 1
      strategy: auto  # overfit: no DDP
      num_workers: 0  # overfit: 20 small JPEG, read in the main process
