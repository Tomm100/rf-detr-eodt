# RF-DETR MAX of Table 7 of the RF-DETR paper (arXiv 2511.09554), as an architecture only: random weights, for
# the latency benchmark (EODT_SPEC.md §6, exception of §10). Neither the rfdetr_plus package nor its checkpoints.
# The table gives resolution, patch, windows, decoder layers, queries and backbone (DINOv2-B); the other fields of
# the decoder are inferred from the parameters and GFLOPs of Appendix E (checked by tests/eodt/test_benchmark.py).
# Unlike XL and 2XL, the Max stays inferred, not verified: rfdetr_plus 1.0.1 and 1.2.0 have no configuration for it.
# The train_config is the one of baseline_medium_win.yaml but output_dir and run, because load_configs needs one:
# to be reviewed before a training (§9, step 11). Read by rfdetr.models.eodt.load_configs.
#
# Written as the configurations hold them: "off" between quotes (bare off is the boolean false) and floats
# with a dot (pyyaml reads 1e-4 as a string). TrainConfig would convert both, but the tests compare file and
# configuration value by value.

model:
  model_config:
    class_path: rfdetr.config.ModelConfig
    init_args:
      # Table 7 of RF-DETR
      encoder: dinov2_windowed_base  # DINOv2-B without registers, as the published checkpoints
      resolution: 828
      patch_size: 12  # RF-DETR does not load DINOv2 at a patch other than 14: random weights
      positional_encoding_size: 69  # resolution / patch_size
      num_windows: 1
      dec_layers: 6
      num_queries: 300
      # not in the table: inferred from the parameters and GFLOPs of Appendix E, not verified (EODT_SPEC.md §6)
      hidden_dim: 512
      sa_nheads: 16
      ca_nheads: 32
      dec_n_points: 4
      out_feature_indexes: [3, 6, 9, 12]
      projector_scale: [P4]
      group_detr: 1  # the parameters used in inference
      num_classes: 90  # COCO: 91 logits
      pretrain_weights: null  # no RF-DETR checkpoint: latency does not depend on the weights (§6)
  train_config:
    class_path: rfdetr.config.TrainConfig
    init_args:
      dataset_file: coco
      dataset_dir: /leonardo_scratch/fast/IscrC_EoDT/coco
      output_dir: /leonardo_work/IscrC_EoDT/tcentonz/runs/rfdetr_table7_max
      # input and augmentation (§7.0)
      multi_scale: "off"
      square_resize_div_64: true
      augmentation_backend: torchvision
      # optimization (§7.1)
      lr: 1.0e-4
      lr_encoder: 1.5e-4
      lr_vit_layer_decay: 0.8
      lr_component_decay: 0.7
      weight_decay: 1.0e-4
      clip_max_norm: 0.1
      lr_scheduler: cosine
      warmup_epochs: 1
      epochs: 12
      batch_size: 4  # per GPU
      grad_accum_steps: 1
      cls_loss_coef: 1.0
      use_ema: true
      ema_decay: 0.993
      amp_dtype: bf16
      seed: 0
      # evaluation (§6): COCO maxDets, applied per image and class; PostProcess keeps num_select = 300
      # detections per image. The same for EoDT and baseline
      eval_max_dets: 100
      # logging (§7.3): W&B offline on the compute nodes, synced from the login node. scripts/leonardo/train.sh
      # sets WANDB_RUN_ID to the name of this file, so that the jobs of a resumed run continue the same W&B run
      wandb: true
      project: eodt
      run: rfdetr_table7_max
      tensorboard: false  # W&B and metrics.csv already hold the curves
      # hardware (Leonardo)
      devices: 4
      num_nodes: 1
      strategy: ddp
      num_workers: 7  # per GPU: one core per GPU left to the main process
