# Baseline, second ring: RF-DETR Medium on DINOv2 ViT-S with 4 registers, without windows (global attention in
# every block of the ViT, as in EoDT).
# Ablation chain of EODT_SPEC.md §5: with windows -> without windows -> without projector -> EoDT.
# The three YAML files of the chain differ only in num_windows, projector and out_feature_indexes, and their
# train_config is the one of configs/eodt/eodt_vits_576_l2-3_learned.yaml but output_dir and run: same recipe, data and
# evaluation as EoDT (checked by tests/eodt/test_baseline_yaml.py). Read by rfdetr.models.eodt.load_configs.
#
# BaselineConfig has no default for the required architecture fields: each of them is written here with the value of
# RF-DETR Medium (§3.6), so a different decoder needs only a change of this file. The other fields keep the defaults
# of ModelConfig, which are those of RF-DETR Medium (checked by tests/eodt/test_baseline_yaml.py).
#
# Written as the configurations hold them: "off" between quotes (bare off is the boolean false) and floats
# with a dot (pyyaml reads 1e-4 as a string). TrainConfig would convert both, but the tests compare file and
# configuration value by value.

model:
  model_config:
    class_path: rfdetr.models.eodt.BaselineConfig
    init_args:
      # backbone (§5, §8 point 4): pretrained DINOv2 resampled to patch 16 with timm's functions, as in EoDT
      encoder: dinov2_registers_windowed_small  # ViT-S with 4 registers
      out_feature_indexes: [3, 6, 9, 12]  # blocks fused by the projector; the last is the last block of the ViT
      resolution: 576
      patch_size: 16
      positional_encoding_size: 36  # resolution / patch_size: the positional embedding of EoDT
      num_windows: 1  # one window: global attention, as in EoDT
      # projector
      projector: true  # MultiScaleProjector of RF-DETR
      projector_scale: [P4]  # one level, at the stride of the ViT
      # decoder of RF-DETR Medium (dim_feedforward 2048 is fixed, as in every size of RF-DETR)
      hidden_dim: 256
      dec_layers: 4
      sa_nheads: 8
      ca_nheads: 16
      dec_n_points: 2
      num_queries: 300
      group_detr: 1  # §5: no Group-DETR
      num_classes: 90  # COCO: 91 logits
  train_config:
    class_path: rfdetr.config.TrainConfig
    init_args:
      dataset_file: coco
      dataset_dir: /leonardo_scratch/fast/IscrC_EoDT/coco
      output_dir: /leonardo_work/IscrC_EoDT/tcentonz/runs/baseline_medium_nowin
      # input and augmentation (§7.0)
      multi_scale: "off"
      square_resize_div_64: true
      augmentation_backend: torchvision
      # optimization (§7.1)
      lr: 1.0e-4
      lr_encoder: 1.5e-4
      lr_vit_layer_decay: 0.8
      lr_component_decay: 0.7
      weight_decay: 1.0e-4
      clip_max_norm: 0.1
      lr_scheduler: cosine
      warmup_epochs: 1
      epochs: 12
      batch_size: 4  # per GPU
      grad_accum_steps: 1
      cls_loss_coef: 1.0
      use_ema: true
      ema_decay: 0.993
      amp_dtype: bf16
      seed: 0
      # evaluation (§6): COCO maxDets, applied per image and class; PostProcess keeps num_select = 300
      # detections per image. The same for EoDT and baseline
      eval_max_dets: 100
      # logging (§7.3): W&B offline on the compute nodes, synced from the login node. scripts/leonardo/train.sh
      # sets WANDB_RUN_ID to the name of this file, so that the jobs of a resumed run continue the same W&B run
      wandb: true
      project: eodt
      run: baseline_medium_nowin
      tensorboard: false  # W&B and metrics.csv already hold the curves
      # hardware (Leonardo)
      devices: 4
      num_nodes: 1
      strategy: ddp
      num_workers: 7  # per GPU: one core per GPU left to the main process
